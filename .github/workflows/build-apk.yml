name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" 2>&1 || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --project-dir android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymPro-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"

          OLD=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "$API/releases/tags/apk-latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -n "$OLD" ]; then
            curl -sf -X DELETE -H "Authorization: token $GH_TOKEN" "$API/releases/$OLD" || true
          fi
          curl -sf -X DELETE -H "Authorization: token $GH_TOKEN" \
            "$API/git/refs/tags/apk-latest" || true

          REL=$(curl -sf -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "$API/releases" \
            -d '{"tag_name":"apk-latest","name":"GymPro Android APK","body":"Descargar GymPro.apk e instalar en el celu.\n(Activar Instalar desde fuentes desconocidas si lo pide)","draft":false,"prerelease":false}')

          RID=$(echo "$REL" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          curl -sf -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=GymPro.apk" \
            --data-binary @"$APK"

          echo "Release $RID publicado OK"
