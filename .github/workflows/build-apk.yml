name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --project-dir android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: GymPro Android APK
          body: |
            Instalador Android de GymPro.
            Descargar e instalar en el celu (activar "Instalar desde fuentes desconocidas" si lo pide).
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
