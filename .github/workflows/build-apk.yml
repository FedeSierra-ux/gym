name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: true
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.welcome=never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore gympro.keystore \
            -alias gympro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname 'CN=GymPro, O=GymPro, C=AR' -noprompt

      - name: Init Bubblewrap project
        run: |
          mkdir -p apk-build
          cp twa-manifest.json apk-build/
          cd apk-build
          bubblewrap update --skipPwaShellUpdate

      - name: Build APK
        working-directory: apk-build
        run: |
          printf 'android\nandroid\n' | bubblewrap build \
            --signing-key-path ../gympro.keystore \
            --signing-key-alias gympro

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GymPro-Android
          path: apk-build/app-release-signed.apk
          if-no-files-found: warn
