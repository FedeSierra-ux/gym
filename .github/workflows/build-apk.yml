name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore gympro.keystore \
            -alias gympro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=GymPro, O=GymPro, C=AR" -noprompt

      - name: Write twa-manifest.json
        run: |
          cat > twa-manifest.json << 'EOF'
          {
            "packageId": "com.fedesierra.gympro",
            "host": "fedesierra-ux.github.io",
            "name": "GymPro",
            "launcherName": "GymPro",
            "display": "standalone",
            "themeColor": "#07070d",
            "navigationColor": "#07070d",
            "navigationColorDark": "#07070d",
            "navigationDividerColor": "#07070d",
            "navigationDividerColorDark": "#07070d",
            "backgroundColor": "#07070d",
            "startUrl": "/gym/",
            "iconUrl": "https://fedesierra-ux.github.io/gym/icons/icon-512.svg",
            "maskableIconUrl": "https://fedesierra-ux.github.io/gym/icons/icon-512.svg",
            "monochromeIconUrl": "",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "../gympro.keystore",
              "alias": "gympro"
            },
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://fedesierra-ux.github.io/gym/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableNotifications": false,
            "orientation": "portrait",
            "fingerprints": [],
            "serviceAccountJsonFile": ""
          }
          EOF

      - name: Build APK
        run: |
          mkdir apk-build
          cp twa-manifest.json apk-build/
          cd apk-build
          bubblewrap build \
            --signing-key-path ../gympro.keystore \
            --signing-key-alias gympro \
            --ks-pass android \
            --key-pass android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymPro-Android
          path: apk-build/app-release-signed.apk
          if-no-files-found: warn
