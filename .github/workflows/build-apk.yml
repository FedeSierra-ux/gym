name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Las actions van pineadas por SHA de commit (el tag va de comentario): un tag
# se puede mover, un SHA no.
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GRADLE_VERSION: '8.4'
      # SHA-256 de gradle-8.4-bin.zip según https://gradle.org/release-checksums/
      GRADLE_SHA256: 3e1af3ae886920c3ac87f7a91f816c0c7c436f276a6eefdb3da152100fef72ae

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=${SDK_ROOT}" > android/local.properties
          SDKM="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKM" ]; then
            SDKM=$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: Install Gradle (checksum verificado)
        run: |
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "${GRADLE_SHA256}  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /opt/gradle

      - name: Generate Gradle wrapper
        run: cd android && "/opt/gradle/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "${GRADLE_VERSION}"

      # Con los cuatro secrets cargados el APK sale firmado con la clave
      # estable (release) y se puede actualizar sobre el instalado. Sin ellos
      # sigue saliendo el debug de siempre, que obliga a desinstalar en cada
      # versión. Cómo generarlos: sección Android del README.
      - name: Keystore de release (si hay secrets)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gympro.keystore"
            echo "tipo=release" >> "$GITHUB_OUTPUT"
            echo "Keystore cargado: se firma el release"
          else
            echo "tipo=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin secrets de firma: el APK sale firmado con la clave de debug (hay que desinstalar para actualizar)"
          fi

      - name: Build APK
        id: build
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          GYMPRO_KEYSTORE_PATH: ${{ steps.keystore.outputs.tipo == 'release' && format('{0}/gympro.keystore', runner.temp) || '' }}
          GYMPRO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GYMPRO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GYMPRO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ "${{ steps.keystore.outputs.tipo }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            APK="android/app/build/outputs/apk/release/app-release.apk"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          cd ..
          test -f "$APK"
          mkdir -p release && cp "$APK" release/GymPro.apk
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GymPro-${{ steps.keystore.outputs.tipo }}
          path: release/GymPro.apk

      # El tag apk-latest se mueve al commit actual y la action actualiza el
      # release existente (o lo crea si no está) reemplazando el asset: en
      # ningún momento queda sin APK publicado, a diferencia de borrar el
      # release viejo antes de crear el nuevo.
      - name: Mover el tag apk-latest
        if: github.event_name != 'pull_request'
        run: |
          git tag -f apk-latest
          git push -f origin apk-latest

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: apk-latest
          name: GymPro Android APK
          body: |
            Descargar GymPro.apk e instalar en el celu.
            (Activar "Instalar desde fuentes desconocidas" si lo pide.)

            Firma: ${{ steps.keystore.outputs.tipo }}${{ steps.keystore.outputs.tipo == 'debug' && ' — hay que desinstalar la versión anterior para instalar esta.' || '' }}
          files: release/GymPro.apk
          fail_on_unmatched_files: true
          make_latest: true
