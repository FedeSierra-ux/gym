<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gym/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0E14" />
    <link rel="apple-touch-icon" sizes="180x180" href="/gym/icons/apple-touch-icon.png" />
    <!-- Sin esto iOS usa una captura de pantalla como ícono al "Agregar a
         pantalla de inicio": el manifest no le alcanza. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GymPro" />
    <title>GymPro</title>
    <meta name="description" content="App de entrenamiento para el gimnasio: rutinas, series y récords guardados en tu teléfono, sin cuenta ni conexión." />
    <!-- Las fuentes se sirven desde la app (ver src/index.css), así que todo
         sale del propio origen. La única salida es la API de Anthropic para
         la IA de Ajustes. style-src 'unsafe-inline' porque React escribe
         estilos en línea; img-src data:/blob: para la foto de perfil y las
         imágenes que se comparten; connect-src blob: porque el APK lee con
         fetch(blob:) lo que la app exporta con <a download>. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: https://api.anthropic.com; worker-src 'self'; manifest-src 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
