<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barra con discos">
  <defs>
    <linearGradient id="c1-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171A24"/>
      <stop offset="1" stop-color="#0C0E14"/>
    </linearGradient>
    <linearGradient id="c1-mark" x1="0.08" y1="0.15" x2="0.92" y2="0.85">
      <stop offset="0" stop-color="#F2A93B"/>
      <stop offset="1" stop-color="#E8634A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#c1-bg)"/>

  <g fill="url(#c1-mark)">
    <!-- discos exteriores -->
    <rect x="30" y="156" width="72" height="200" rx="24"/>
    <rect x="410" y="156" width="72" height="200" rx="24"/>
    <!-- discos interiores -->
    <rect x="110" y="196" width="50" height="120" rx="18"/>
    <rect x="352" y="196" width="50" height="120" rx="18"/>
    <!-- barra -->
    <rect x="160" y="226" width="192" height="60" rx="14"/>
  </g>

  <!-- moleteado del agarre -->
  <g fill="#0C0E14" opacity="0.5">
    <rect x="232" y="234" width="8" height="44" rx="4"/>
    <rect x="252" y="234" width="8" height="44" rx="4"/>
    <rect x="272" y="234" width="8" height="44" rx="4"/>
  </g>
</svg>
