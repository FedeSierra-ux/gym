name: Refrescar GIFs de ejercicios

# Corre a mano desde la pestaña Actions. Consulta ExerciseDB (GitHub sí tiene
# internet), corrige los mediaId de las imágenes matcheando por nombre y abre un
# PR con los cambios para revisar.
on:
  workflow_dispatch:
    inputs:
      api:
        description: 'Base(s) de la API de ExerciseDB (separadas por coma, se prueban en orden)'
        required: false
        default: 'https://www.exercisedb.dev/api/v1,https://exercisedb-api.vercel.app/api/v1'
      threshold:
        description: 'Score mínimo de match (0-1)'
        required: false
        default: '0.55'
      insecure_tls:
        description: 'Ignorar cert TLS vencido de exercisedb.dev (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Correr refresco de GIFs
        env:
          EXERCISEDB_API: ${{ github.event.inputs.api }}
          MATCH_THRESHOLD: ${{ github.event.inputs.threshold }}
          # El cert de exercisedb.dev está vencido; con insecure_tls=true se ignora
          # (solo para este fetch de datos públicos en un runner efímero de CI).
          # El script usa un https.Agent con rejectUnauthorized:false para asegurarlo.
          INSECURE_TLS: ${{ github.event.inputs.insecure_tls }}
          NODE_TLS_REJECT_UNAUTHORIZED: ${{ github.event.inputs.insecure_tls == 'true' && '0' || '1' }}
          GIF_REPORT: ${{ runner.temp }}/gif-refresh-report.md
        run: node scripts/refresh-gifs.mjs

      - name: Verificar build
        run: npm ci && npm run build

      - name: Abrir PR si hay cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/exercises.ts; then
            echo "Sin cambios en los GIFs. Nada que hacer."
            exit 0
          fi
          BRANCH="bot/refresh-gifs-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/exercises.ts
          git commit -m "chore: refrescar GIFs de ejercicios (auto)"
          git push -u origin "$BRANCH"
          BODY="${{ runner.temp }}/gif-refresh-report.md"
          [ -f "$BODY" ] || echo "Refresco automático de GIFs." > "$BODY"
          gh pr create \
            --title "chore: refrescar GIFs de ejercicios" \
            --body-file "$BODY" \
            --base main \
            --head "$BRANCH"
